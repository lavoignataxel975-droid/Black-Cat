<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 / V2 — The Black Cat</title>
<meta name="description" content="Comparateur des deux versions du site The Black Cat.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/logo-header.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0908; --ink-2: #121010; --ink-3: #1a1616;
    --bone: #ede5d3; --bone-60: rgba(237,229,211,.6); --bone-40: rgba(237,229,211,.4);
    --line: rgba(237,229,211,.12); --line-2: rgba(237,229,211,.22);
    --red: #c4141f; --brass: #c9a468;
    --bar: 118px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--bone);
    font-family: 'Barlow', system-ui, sans-serif;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  /* ---------- Barre de contrôle ---------- */
  .bar {
    flex: none;
    border-bottom: 1px solid var(--line);
    background: var(--ink-2);
    padding: 12px 18px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand img { height: 26px; }
  .brand b {
    font-family: 'Anton', sans-serif; font-weight: 400;
    text-transform: uppercase; font-size: 1rem; letter-spacing: .02em;
  }
  .brand span {
    font-family: 'Bebas Neue', sans-serif; font-size: .75rem;
    letter-spacing: .2em; color: var(--brass);
    border: 1px solid rgba(201,164,104,.4); border-radius: 999px;
    padding: 3px 9px 2px;
  }

  .grp { display: flex; align-items: center; gap: 6px; }
  .grp > small {
    font-family: 'Bebas Neue', sans-serif; font-size: .75rem;
    letter-spacing: .2em; color: var(--bone-40); text-transform: uppercase;
    margin-right: 4px;
  }
  .seg { display: flex; gap: 4px; background: rgba(237,229,211,.05); padding: 4px; border-radius: 999px; }
  .seg button {
    padding: 7px 14px 6px; border-radius: 999px;
    font-family: 'Bebas Neue', sans-serif; font-size: .875rem;
    letter-spacing: .12em; text-transform: uppercase; color: var(--bone-60);
    transition: background .25s, color .25s;
    white-space: nowrap;
  }
  .seg button:hover { color: var(--bone); }
  .seg button[aria-pressed="true"] { background: var(--bone); color: var(--ink); }
  .spacer { flex: 1; }
  .bar .out {
    font-family: 'Bebas Neue', sans-serif; font-size: .8125rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--bone-60);
    border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px 6px;
    transition: background .25s, color .25s;
  }
  .bar .out:hover { background: var(--bone); color: var(--ink); }

  /* ---------- Scène ---------- */
  .stage {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--line);
  }
  .stage[data-view="v1"] { grid-template-columns: 1fr; }
  .stage[data-view="v2"] { grid-template-columns: 1fr; }
  .stage[data-view="v1"] .pane--v2,
  .stage[data-view="v2"] .pane--v1 { display: none; }

  .pane { position: relative; background: var(--ink); display: flex; flex-direction: column; min-width: 0; }
  .pane__head {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 16px;
    background: var(--ink-3);
    border-bottom: 1px solid var(--line);
    font-family: 'Bebas Neue', sans-serif; font-size: .8125rem;
    letter-spacing: .2em; text-transform: uppercase; color: var(--bone-60);
  }
  .pane--v1 .pane__head b { color: var(--bone); }
  .pane--v2 .pane__head b { color: var(--red); }
  .pane__head b { font-weight: 400; }
  .pane__head a { color: var(--brass); }
  .pane__head a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .frame-wrap {
    flex: 1; min-height: 0;
    display: flex; justify-content: center;
    background: #050505;
    overflow: auto;
  }
  .frame-wrap iframe {
    width: 100%; height: 100%; border: 0; background: var(--ink);
    display: block;
  }
  /* Simulation mobile : largeur figée, cadre centré */
  .stage[data-device="mobile"] .frame-wrap { padding: 18px 0; }
  .stage[data-device="mobile"] iframe {
    width: 390px; max-width: 100%; height: 844px; max-height: 100%;
    border-radius: 22px;
    box-shadow: 0 0 0 1px var(--line-2), 0 30px 60px -20px #000;
  }

  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .bar { padding: 10px 12px; }
    .spacer { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="bar">
  <span class="brand">
    <img src="assets/img/logo-header.png" alt="">
    <b>The Black Cat</b>
    <span>V1 / V2</span>
  </span>

  <div class="grp">
    <small>Page</small>
    <div class="seg" id="pages" role="group" aria-label="Page à comparer"></div>
  </div>

  <div class="grp">
    <small>Vue</small>
    <div class="seg" id="views" role="group" aria-label="Mode d'affichage">
      <button type="button" data-view="both" aria-pressed="true">Côte à côte</button>
      <button type="button" data-view="v1" aria-pressed="false">V1</button>
      <button type="button" data-view="v2" aria-pressed="false">V2</button>
    </div>
  </div>

  <div class="grp">
    <small>Écran</small>
    <div class="seg" id="devices" role="group" aria-label="Largeur d'écran simulée">
      <button type="button" data-device="desktop" aria-pressed="true">Bureau</button>
      <button type="button" data-device="mobile" aria-pressed="false">Mobile</button>
    </div>
  </div>

  <span class="spacer"></span>
  <a class="out" href="v2/index.html">Ouvrir la V2 en plein écran ↗</a>
</div>

<div class="stage" id="stage" data-view="both" data-device="desktop">
  <section class="pane pane--v1">
    <div class="pane__head">
      <span><b>Version 1</b> — existante</span>
      <a id="lnk1" href="index.html" target="_blank" rel="noopener">Ouvrir ↗</a>
    </div>
    <div class="frame-wrap"><iframe id="f1" title="Site The Black Cat — version 1" src="index.html"></iframe></div>
  </section>

  <section class="pane pane--v2">
    <div class="pane__head">
      <span><b>Version 2</b> — redesign</span>
      <a id="lnk2" href="v2/index.html" target="_blank" rel="noopener">Ouvrir ↗</a>
    </div>
    <div class="frame-wrap"><iframe id="f2" title="Site The Black Cat — version 2" src="v2/index.html"></iframe></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // Les deux versions n'ont pas exactement les mêmes noms de fichiers :
  // on associe explicitement chaque page V1 à son équivalent V2.
  var PAGES = [
    { label: 'Accueil',   v1: 'index.html',     v2: 'v2/index.html' },
    { label: 'Le Bar',    v1: 'le-bar.html',    v2: 'v2/le-bar.html' },
    { label: 'La Carte',  v1: 'carte.html',     v2: 'v2/carte.html' },
    { label: 'Événements', v1: 'evenement.html', v2: 'v2/evenement.html' },
    { label: 'Réserver',  v1: 'reserver.html',  v2: 'v2/reserver.html' }
  ];

  var stage = document.getElementById('stage');
  var f1 = document.getElementById('f1'), f2 = document.getElementById('f2');
  var lnk1 = document.getElementById('lnk1'), lnk2 = document.getElementById('lnk2');
  var pagesBox = document.getElementById('pages');

  pagesBox.innerHTML = PAGES.map(function (p, i) {
    return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '">' + p.label + '</button>';
  }).join('');

  function press(box, attr, value) {
    Array.prototype.forEach.call(box.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.dataset[attr] === value));
    });
  }

  pagesBox.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var p = PAGES[+b.dataset.i];
    f1.src = p.v1; f2.src = p.v2;
    lnk1.href = p.v1; lnk2.href = p.v2;
    Array.prototype.forEach.call(pagesBox.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
  });

  document.getElementById('views').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    stage.dataset.view = b.dataset.view;
    press(this, 'view', b.dataset.view);
  });

  document.getElementById('devices').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    stage.dataset.device = b.dataset.device;
    press(this, 'device', b.dataset.device);
  });
})();
</script>
</body>
</html>
